scopes:
  source:
    manual:

merge_queue:
  max_parallel_checks: 1
  skip_intermediate_results: false
  mode: isolated

queue_rules:
  - name: vm4-jenkins-multicommit-scope-261004
    batch_size: 1
    batch_max_wait_time: 2 sec
    queue_conditions:
      - title = VM4 JENKINS MULTICOMMIT SCOPE 261004
      - scope = benign-scope
      - -scope = protected-scope
    merge_method: merge

  - name: vm4-batch-note-scope-freshness-261005
    batch_size: 1
    batch_max_wait_time: 2 sec
    queue_conditions:
      - title = VM4 BATCH NOTE SCOPE FRESHNESS 261005
    merge_conditions:
      - check-success = ci-gate
    merge_method: merge

  - name: vm4-forged-note-gate2-261005
    batch_size: 1
    batch_max_wait_time: 2 sec
    queue_conditions:
      - title = VM4 FORGED NOTE GATE2 STAGING 261005
    merge_conditions:
      - check-success = ci-gate
      - label = vm4-forged-note-release-261005
    merge_method: merge

pull_request_rules:
  - name: vm4-batch-note-autoqueue-261005
    conditions:
      - title = VM4 BATCH NOTE SCOPE FRESHNESS 261005
    actions:
      queue:
        name: vm4-batch-note-scope-freshness-261005
