name: VM4 Scope Gate 20261005

on:
  pull_request:
    branches:
      - main

jobs:
  detect-scopes:
    runs-on: ubuntu-24.04
    outputs:
      protected: ${{ steps.pick.outputs.protected }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Hold for post-composition scope update
        run: sleep 45

      - name: Install Mergify CLI 2026.10.1
        uses: Mergifyio/setup-cli@dc99f07e699b94b39e5495c24596372813eadcbc
        with:
          mergify_cli_version: 2026.10.1

      - name: Read Mergify merge-queue note
        id: queue_info
        run: mergify ci queue-info

      - name: Normalize protected scope
        id: pick
        env:
          QUEUE_METADATA: ${{ steps.queue_info.outputs.queue_metadata }}
        run: |
          value="$(jq -r '((.scopes // []) | index("protected-scope")) != null' <<<"$QUEUE_METADATA")"
          echo "protected=$value" >> "$GITHUB_OUTPUT"
          echo "queue_metadata=$QUEUE_METADATA"

  protected-tests:
    needs: detect-scopes
    if: ${{ needs.detect-scopes.outputs.protected == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Protected scope marker
        run: echo "PROTECTED_SCOPE_EXECUTED"

  ci-gate:
    if: ${{ !cancelled() }}
    needs:
      - detect-scopes
      - protected-tests
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate scope coverage
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: wait-jobs
          jobs: ${{ toJSON(needs) }}
